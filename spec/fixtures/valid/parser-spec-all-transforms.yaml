      trace_id: "deadbeef"
      client_ip: "203.0.113.0/24"
      user_email: "<email:9f2c41d07a3b55e1>"
      customer_name: null
      cache_hit_pct: 75
      items_flag: true
      payload_bytes: 4096
      severity_bucket: "2"
      redacted_secret: null
      payload_obj: { k: 1 }
      note_text: null
